apply plugin: 'com.android.application'

// Kotlin is built into AGP 9 (no kotlin-android plugin needed)

apply plugin: 'com.google.gms.google-services'

// Apply the Crashlytics Gradle plugin
apply plugin: 'com.google.firebase.crashlytics'

// Secrets (Maps key, keystore passwords) are kept out of git in <project>/secrets.properties
// see secrets.properties.example
def secrets = new Properties()
def secretsFile = rootProject.file('secrets.properties')
if (secretsFile.exists()) {
    secretsFile.withInputStream { secrets.load(it) }
}

android {
    namespace = 'com.sensoguard.trailmanager'
    compileSdk = 37

    defaultConfig {
        applicationId = "com.sensoguard.trailmanager"
        minSdk = 26
        targetSdk = 37
        versionCode = 62
        versionName = "1.62"
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [MAPS_API_KEY: secrets.getProperty('MAPS_API_KEY', '')]
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    packaging {
        resources {
            pickFirsts += ['META-INF/LICENSE.txt', 'META-INF/LICENSE.md', 'META-INF/NOTICE.md']
        }
    }

    signingConfigs {
        release {
            if (secrets.getProperty('RELEASE_STORE_FILE')) {
                storeFile = file(secrets.getProperty('RELEASE_STORE_FILE'))
                storePassword = secrets.getProperty('RELEASE_STORE_PASSWORD')
                keyAlias = secrets.getProperty('RELEASE_KEY_ALIAS')
                keyPassword = secrets.getProperty('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            //remove the unused code (see proguard-rules.pro)
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            ext.alwaysUpdateBuildId = false
            debuggable = true
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // the app changes the language at runtime, so all languages must be in the base APK
    bundle {
        language {
            enableSplit = false
        }
    }
}

configurations {
    configureEach {
        exclude module: 'commons-logging'
    }
}

dependencies {
    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.fragment:fragment-ktx:1.9.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'com.google.android.material:material:1.14.0'

    // Google Play services
    implementation 'com.google.android.gms:play-services-maps:20.1.0'
    implementation 'com.google.android.gms:play-services-location:21.4.0'

    // Firebase (the BoM sets the versions; the -ktx modules were removed in BoM 34)
    implementation platform('com.google.firebase:firebase-bom:35.0.1')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'

    // Email (IMAP) and parsing
    implementation 'com.sun.mail:android-mail:1.6.8'
    implementation 'com.sun.mail:android-activation:1.6.8'
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'org.apache.commons:commons-lang3:3.21.0'
    implementation 'com.google.code.gson:gson:2.14.0'

    // UI
    implementation 'com.github.bumptech.glide:glide:5.0.9'
    implementation 'com.squareup:android-times-square:1.7.11@aar'
    implementation 'com.daimajia.swipelayout:library:1.2.0@aar'
    //Support language
    implementation 'com.github.delight-im:Android-Languages:v1.0.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
